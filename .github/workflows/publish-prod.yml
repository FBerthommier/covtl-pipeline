# Production PyPI publication via Trusted Publishing (OIDC, no token).
#
# publish-prod.yml is the workflow registered as a GitHub Actions trusted
# publisher on the PyPI project covtl-synth.
#
# MANUAL ONLY (workflow_dispatch): nothing ships without an explicit
# owner gesture. Bump the version in pyproject.toml BEFORE dispatching;
# the build publishes exactly what is committed. Requires the GitHub
# repository environment "pypi" (created automatically on first run) and
# the publisher registered on PyPI:
#   owner FBerthommier / repository covtl-pipeline /
#   workflow publish-prod.yml / environment pypi

name: publish-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish covtl-synth to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build covtl-synth (sdist + wheel)
        run: python -m build

      - name: Twine check
        run: |
          python -m twine check dist/*
          ls -l dist

      - name: Upload covtl-synth to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
