# CI for covtl-pipeline / vtl-synth.
#
# windows-latest on purpose: the regression baselines (tract/glottis
# sha256, schema 3) are generated and acoustically validated on
# Windows, and the cross-platform last-bit float determinism of the
# C++-adjacent layers is not established — a Linux job would test the
# platform, not the code. (The engine wheel installs on the runners,
# as proven by the companion repositories' CI.)
name: CI

on:
  push:
  pull_request:

jobs:
  # Fast lane (wave 3 recommendation, COVERAGE_REPORT.md wave 2 §5.1):
  # the phonetic-input corpus locks the model notation (CV/CCV/VCV
  # categories, space/|/%/. separators, C vs CC vs C.C cluster
  # semantics — covtl-lambda conformity) in ~6 s and yields ~40 %
  # package coverage. It runs on every push/PR as an early signal,
  # ahead of the full ~3 min suite below.
  phonetic-fast:
    name: phonetic corpus (fast, ~6 s)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      - name: Phonetic corpus
        run: pytest tests/test_phonetic_model_inputs.py --cov=vtl_synth --cov-branch --cov-report=term

  tests:
    name: pytest + coverage (full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov matplotlib
      - name: Tests + coverage
        run: pytest tests/ --cov=vtl_synth --cov-branch --cov-report=term

  baselines:
    name: regression baselines (5 speakers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      # Permutes the two repo layers the tract/glottis signals depend on
      # (constants.py + ACTIVE_SPEAKER marker) and runs the baseline
      # tests for each speaker in a fresh subprocess. The audio wheel is
      # not involved (baselines stop at the tract/glottis matrices).
      - name: Baseline matrix
        run: python scripts/run_baselines_matrix.py
