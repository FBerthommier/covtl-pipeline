[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covtl-synth"
version = "1.2.1"
description = "Articulatory synthesis from text (Berthommier COVTL model + VocalTractLab): 5 speakers, 6 languages, expressive prosody, phonation modes, sandhi, polar video"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Frédéric Berthommier"},
]
keywords = [
    "articulatory synthesis",
    "vocal tract",
    "VocalTractLab",
    "speech synthesis",
    "coarticulation",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "vocaltractlab-cython>=0.0.10",
    "Pillow>=9.0",
    "imageio-ffmpeg>=0.4",
    "cmudict>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
plot = [
    "matplotlib>=3.5",
]

[project.scripts]
vtl-synth = "vtl_synth.cli.main:main"

[project.urls]
Homepage = "https://github.com/fberthommier/covtl-pipeline"
Repository = "https://github.com/fberthommier/covtl-pipeline"
Documentation = "https://www.vocaltractlab.de"

[tool.setuptools.packages.find]
# allowlist: only vtl_synth* ships with pip install — examples/
# (incl. the interactive HTML demos), docs/ and lang_pack/ are
# repository-only, never packaged (sdist guard: MANIFEST.in).
where = ["."]
include = ["vtl_synth*"]

[tool.setuptools.package-data]
vtl_synth = [
    "py.typed",
    "data/vtl_binaries/*",
    "data/speakers/registry.json",
    "data/speakers/*.speaker",
    "data/speakers/*_constants.py",
    "data/*.tsv",
    "data/README_*_lexicon.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage policy (decisions documented in LEGACY.md):
# branch coverage on the whole shipped package; the omissions below are
# dead code (kept for import compatibility) and the ffmpeg encoding
# path — each with the evidence recorded in LEGACY.md.
[tool.coverage.run]
branch = true
source = ["vtl_synth"]
omit = [
    "*/tests/*",
    "*/data/*",
    "*/__pycache__/*",
    "vtl_synth/data/*",
    # dead since the glottal_source port, zero importers (LEGACY.md §2)
    "vtl_synth/core/pulmonary_effort.py",
    # research/calibration tool, not on the runtime path (LEGACY.md §2)
    "vtl_synth/utils/calibrate_vowels.py",
    # ffmpeg encoding: slow and not bit-stable (LEGACY.md §3)
    "vtl_synth/video/encoder.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
omit = [
    # dead since the glottal_source port, zero importers (LEGACY.md §2)
    "vtl_synth/core/pulmonary_effort.py",
    # research/calibration tool, not on the runtime path (LEGACY.md §2)
    "vtl_synth/utils/calibrate_vowels.py",
    # ffmpeg encoding: slow and not bit-stable (LEGACY.md §3)
    "vtl_synth/video/encoder.py",
]
